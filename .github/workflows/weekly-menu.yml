name: Weekly menu to Discord

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-menu-discord
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test

      - name: Restore delivery history
        id: history
        shell: bash
        run: |
          state_file="$RUNNER_TEMP/weekly-menu-state.json"
          echo "STATE_FILE=$state_file" >> "$GITHUB_ENV"
          remote_ref=$(git ls-remote --heads origin refs/heads/bot-state)
          if [[ -n "$remote_ref" ]]; then
            git fetch --depth=1 origin bot-state:refs/remotes/origin/bot-state
            git show refs/remotes/origin/bot-state:state.json > "$state_file"
          fi

      - name: Send new menus
        id: send
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm start

      # Preserve completed posts even when a later post failed to send.
      - name: Save delivery history
        if: ${{ always() && steps.history.outcome == 'success' && steps.send.outcome != 'skipped' }}
        shell: bash
        run: |
          if [[ ! -f "$STATE_FILE" ]]; then exit 0; fi
          if git show-ref --verify --quiet refs/remotes/origin/bot-state; then
            git switch --force-create bot-state refs/remotes/origin/bot-state
          else
            git switch --orphan bot-state
          fi
          cp "$STATE_FILE" state.json
          git add state.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update menu delivery history'
          git push origin HEAD:refs/heads/bot-state
